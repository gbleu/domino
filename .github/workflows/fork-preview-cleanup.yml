name: Fork Preview Cleanup

# Upstream's cleanup-preview-release.yml only runs in upstream's repository, and only at
# close, while a PR merged before its CI ends publishes its preview after that. So this also
# runs after each preview run, whatever its outcome since a failed run can leave its release
# behind, and sweeps every preview whose PR is no longer open.
'on':
  # Not pull_request, which gives a PR from another repository a read-only token. This job
  # checks out nothing, so no code from the PR runs with the write token.
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ['Preview Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Two sweeps running at once would race to delete the same release, and the loser would fail.
concurrency:
  group: fork-preview-cleanup
  cancel-in-progress: false

jobs:
  sweep:
    name: Delete previews of closed PRs
    runs-on: ubuntu-latest
    steps:
      - name: Delete every preview whose PR is not open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previews=$(gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName')
          for tag in $previews; do
            [[ "$tag" =~ ^pr-([0-9]+)-[0-9a-f]+$ ]] || continue
            # A separate assignment, so a failed lookup aborts the sweep instead of reading as closed.
            state=$(gh pr view "${BASH_REMATCH[1]}" --json state --jq .state)
            [[ "$state" == OPEN ]] && continue
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
